// Lấy tồn kho từ PM Kho (db.khoStock) vào đơn hàng
function layTonKhoTuKho(id){
  const o=db.orders.find(x=>x.id===id); if(!o) return;
  const p=GP(o.productId); if(!p) return;
  if(!o.materialStock) o.materialStock={};
  const khoStock=db.khoStock||{};
  let count=0;
  (p.bom||[]).forEach(m=>{
    const matId=db.materials.find(x=>x.code===m.matCode)?.id;
    // Tìm tồn kho theo matCode hoặc matId
    const stock=khoStock[m.matCode]??khoStock[matId]??null;
    if(stock!==null){
      o.materialStock[m.matCode]=parseFloat(stock);
      count++;
    }
  });
  if(count===0){
    alert('Chưa có dữ liệu tồn kho trong Phần mềm Kho.\nHãy cập nhật tồn kho tại PM Kho trước.');
    return;
  }
  saveDB();
  go('order-detail',id);
  setTimeout(()=>{
    const bar=document.querySelector('[style*="mat-matrix"]');
    if(bar) bar.scrollIntoView({behavior:'smooth'});
  },300);
}

let _pvPid=null,_pvIdx=0;
function openPV(pid,idx){
  _pvPid=pid;_pvIdx=idx;
  renderPV();
  document.getElementById('pv-over').classList.add('open');
}
function renderPV(){
  const p=GP(_pvPid);
  if(!p||!p.images||!p.images[_pvIdx])return;
  document.getElementById('pv-img').src=p.images[_pvIdx].data;
  document.getElementById('pv-prev').style.display=_pvIdx>0?'flex':'none';
  document.getElementById('pv-next').style.display=_pvIdx<p.images.length-1?'flex':'none';
}
function pvNav(dir){
  const p=GP(_pvPid);if(!p)return;
  _pvIdx=Math.max(0,Math.min(p.images.length-1,_pvIdx+dir));
  renderPV();
}
function closePV(e){
  if(!e||e.target===document.getElementById('pv-over'))
    document.getElementById('pv-over').classList.remove('open');
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('pv-over').classList.contains('open'))return;
  if(e.key==='ArrowLeft')pvNav(-1);
  else if(e.key==='ArrowRight')pvNav(1);
  else if(e.key==='Escape')closePV();

function getReminders(){
  const now=new Date(); now.setHours(0,0,0,0);
  return db.orders
    .filter(o=>o.deliveryDate&&o.status!=='done'&&o.status!=='cancelled')
    .map(o=>{
      const d=new Date(o.deliveryDate); d.setHours(0,0,0,0);
      const days=Math.round((d-now)/(86400000));
      return{...o,daysLeft:days};
    })
    .sort((a,b)=>a.daysLeft-b.daysLeft);
}

function urgencyOf(days){
  if(days<0)  return{cls:'overdue',color:'var(--danger)', icon:'ti-alert-triangle',    label:'Đã trễ hạn '+Math.abs(days)+' ngày'};
  if(days===0)return{cls:'today',  color:'var(--danger)', icon:'ti-alarm',             label:'Hôm nay là ngày giao!'};
  if(days===1)return{cls:'today',  color:'var(--danger)', icon:'ti-clock-exclamation', label:'Còn 1 ngày'};
  if(days===2)return{cls:'soon',   color:'var(--warn)',   icon:'ti-clock',             label:'Còn 2 ngày'};
  if(days<=7) return{cls:'ok',     color:'var(--success)',icon:'ti-clock-check',       label:'Còn '+days+' ngày'};
  return null;
}

function requestNotifPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default') Notification.requestPermission();
}

function sendBrowserNotifs(urgent){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  // Only fire once per session per order (track by sessionStorage)
  urgent.forEach(o=>{
    const key='rmn_notif_'+o.id;
    if(sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key,'1');
    const p=GP(o.productId);
    const u=urgencyOf(o.daysLeft);
    new Notification('📦 GiáThành Pro – Nhắc nhở đơn hàng',{
      body:`${o.orderCode}${p?' – '+p.name:''}\n${u?u.label:'Sắp đến hạn'} (${o.deliveryDate})`,
      icon:'',
      tag:'rmn_'+o.id,
    });
  });
}

let _syncTimer=null, _syncPushing=false, _pushDebounce=null, _sse=null;

function getMachineId(){

  if(!id){id='M'+Math.random().toString(36).substr(2,6).toUpperCase();localStorage.setItem('gt_machine_id',id);}
  return id;
}
function getSyncCfg(){
  return{
    dbUrl:(localStorage.getItem('gt_fb_url')||'').replace(/\/+$/,''),
    enabled:localStorage.getItem('gt_sync_on')==='1',
    interval:(parseInt(localStorage.getItem('gt_sync_interval'))||30)*1000
  };
}
function setSyncUI(s,msg){
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-status-text');
  const bar=document.getElementById('sync-status-bar');
  if(!dot||!txt) return;

  dot.textContent=icons[s]||'⚪';
  txt.textContent=msg||(s==='ok'?'Đã đồng bộ':s==='err'?'Lỗi kết nối':s==='sync'?'Đang đồng bộ...':'Đồng bộ tắt');
}

// Debounce push: chờ 3 giây sau lần saveDB cuối rồi mới push tránh rate limit

// Kiểm tra môi trường và fetch wrapper hỗ trợ CORS proxy
function getProtocol(){return window.location.protocol;}
async function syncFetch(url,opts={}){
  // file:// bị Chrome/Edge chặn kết nối ra ngoài — phải host trên server
  if(window.location.protocol==='file:'){
    setSyncUI('err','Cần host lên Netlify');
    const el=document.getElementById('sync-test-result');
    if(el) el.innerHTML=`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.7">
      ⚠️ <b>Đang mở file:// — trình duyệt chặn kết nối mạng</b><br>
      Để đồng bộ hoạt động, cần upload file lên server:<br><br>
      1. Vào <a href="https://app.netlify.com/drop" target="_blank" style="color:var(--accent);font-weight:600">app.netlify.com/drop</a><br>
      2. Kéo thả file <b>giathanh_pro.html</b> vào<br>
      3. Nhận link dạng <code>https://xxx.netlify.app</code><br>
      4. Mở link đó → đồng bộ chạy bình thường
    </div>`;
    throw new Error('file:// không hỗ trợ kết nối mạng');
  }
  return fetch(url,{...opts,cache:'no-cache'});
}

async function pushSync(){
  const cfg=getSyncCfg();
  if(!cfg.enabled||!cfg.dbUrl) return;
  if(_syncPushing){
    clearTimeout(_pushDebounce);
    _pushDebounce=setTimeout(pushSync,3000);
    return;
  }
  _syncPushing=true;
  setSyncUI('sync','Đang đẩy...');
  try{
    const now=Date.now();
    const payload={
      materials:db.materials||[],
      factories:db.factories||[],
      products:db.products||[],
      orders:db.orders||[],
      _at:now,
      _by:getMachineId()
    };
    const r=await syncFetch(`${cfg.dbUrl}/giathanh.json`,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if(r.ok){
      localStorage.setItem('gt_sync_at',String(now));
      localStorage.setItem('gt_last_sync',new Date().toLocaleString('vi-VN'));
      setSyncUI('ok','Đã lưu '+new Date().toLocaleTimeString('vi-VN'));
    } else {
      const d=await r.json().catch(()=>({}));
      setSyncUI('err','Lỗi '+r.status+(d.error?' — '+d.error:''));
    }
  }catch(e){
    setSyncUI('err','Lỗi kết nối: '+e.message.slice(0,40));
  }
  finally{_syncPushing=false;}
}

async function pullSync(silent=false){
  const cfg=getSyncCfg();
  if(!cfg.enabled||!cfg.dbUrl) return;
  if(!silent) setSyncUI('sync','Đang kéo...');
  try{
    const r=await syncFetch(`${cfg.dbUrl}/giathanh.json`);
    if(!r.ok){const d=await r.json().catch(()=>({}));setSyncUI('err','Lỗi '+r.status+(d.error?' — '+d.error:''));return;}
    const remote=await r.json();
    if(!remote||typeof remote!=='object'){setSyncUI('err','Dữ liệu không hợp lệ');return;}
    if(!remote.materials&&!remote.orders&&!remote.products&&!remote.factories){
      setSyncUI('sync','Bin trống — đẩy dữ liệu...');
      _syncPushing=false;
      await pushSync(); return;
    }
    const remoteAt=remote._at||0;
    const localAt=parseInt(localStorage.getItem('gt_sync_at')||'0');
    const fromOtherMachine=!remote._by||(remote._by!==getMachineId());
    if(remoteAt>localAt&&fromOtherMachine){
      mergeDB(remote);
      localStorage.setItem('gt_db',JSON.stringify(db));
      localStorage.setItem('gt_sync_at',String(remoteAt));
      localStorage.setItem('gt_last_sync',new Date().toLocaleString('vi-VN'));
      render();
      setSyncUI('ok','Nhận cập nhật '+new Date().toLocaleTimeString('vi-VN'));
    } else {
      setSyncUI('ok','Đồng bộ '+new Date().toLocaleTimeString('vi-VN'));
    }
  }catch(e){
    setSyncUI('err','Lỗi: '+e.message.slice(0,40));
  }
}

function startAutoSync(){
  const cfg=getSyncCfg();
  if(_syncTimer){clearInterval(_syncTimer);_syncTimer=null;}
  if(_sse){try{_sse.close();}catch(e){}  _sse=null;}
  if(!cfg.enabled||!cfg.dbUrl){setSyncUI('off','Đồng bộ tắt');return;}

  // Tải dữ liệu ban đầu
  pullSync(true);

  // Thử SSE real-time (server nội bộ có /events)
  try{
    const evtUrl=cfg.dbUrl.replace(/\/+$/,'')+'/events';
    _sse=new EventSource(evtUrl);
    _sse.onopen=()=>{
      setSyncUI('ok','⚡ Real-time');
      if(_syncTimer){clearInterval(_syncTimer);_syncTimer=null;}
    };
    _sse.addEventListener('update',e=>{
      try{
        const remote=JSON.parse(e.data);
        if(!remote||(!remote.materials&&!remote.orders)) return;
        if(remote._by===getMachineId()) return;
        mergeDB(remote);
        localStorage.setItem('gt_db',JSON.stringify(db));
        localStorage.setItem('gt_sync_at',String(remote._at||Date.now()));
        render();
        setSyncUI('ok','⚡ '+new Date().toLocaleTimeString('vi-VN'));
      }catch(err){}
    });
    _sse.onerror=()=>{
      // SSE lỗi → fallback polling (Firebase không có /events)
      if(!_syncTimer) _syncTimer=setInterval(()=>pullSync(true),cfg.interval);
    };
  }catch(e){
    _syncTimer=setInterval(()=>pullSync(true),cfg.interval);
  }
}

function exportDB(){
  const json=JSON.stringify(db,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date().toLocaleDateString('vi-VN').replace(/\//g,'-');
  a.href=url; a.download=`giathanh_backup_${d}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importDB(mode){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange=async e=>{
    const file=e.target.files[0]; if(!file) return;
    try{
      const text=await file.text();
      const imported=JSON.parse(text);
      if(!imported.products&&!imported.orders&&!imported.materials)
        return alert('File không đúng định dạng GiáThành Pro.');
      if(mode==='replace'){
        if(!confirm(`Thay thế toàn bộ dữ liệu bằng file "${file.name}"?\nHành động này KHÔNG thể hoàn tác!`)) return;
        db=imported;
        if(!db.orders)db.orders=[];if(!db.materials)db.materials=[];
        if(!db.factories)db.factories=[];if(!db.products)db.products=[];
      } else mergeDB(imported);
      saveDB();
      render();
      alert(`✅ Nhập thành công!\nSản phẩm: ${db.products.length} | Đơn hàng: ${db.orders.length} | NPL: ${db.materials.length}`);
    }catch(err){alert('Lỗi đọc file: '+err.message);}
  };
  inp.click();
}

function mergeDB(imported){
  ['materials','factories','products','orders'].forEach(key=>{
    const local=db[key]||[];
    const remote=(imported[key]||[]);
    remote.forEach(item=>{
      if(!item||!item.id) return;
      const idx=local.findIndex(x=>x.id===item.id);
      if(idx===-1) local.push(item);
      else{
        const ld=local[idx].updatedAt||'';
        const rd=item.updatedAt||'';
        if(rd>ld) local[idx]=item;
      }
    });
    db[key]=local;
  });
}

function resetDB(){
  if(!confirm('XÓA TOÀN BỘ dữ liệu?\n\nNên xuất backup trước. Tiếp tục?')) return;
  if(!confirm('Xác nhận: Xóa sạch tất cả dữ liệu?')) return;
  localStorage.removeItem('gt_db');
  localStorage.removeItem('gt_last_sync');
  localStorage.removeItem('gt_sync_at');
  db={materials:[],factories:[],products:[],orders:[]};
  render();
  alert('Đã xóa. Phần mềm về trạng thái ban đầu.');
}

(function initPWA(){
  // Nếu chạy trên server nội bộ → dùng manifest từ server (PWA cài được chuẩn)
  if(window.location.protocol!=='file:'){
    document.getElementById('pwa-manifest').href='/manifest.json';
  }
  const manifest={
    name:'GiáThành Pro',
    short_name:'GiáThành',
    description:'Phần mềm theo dõi giá thành và đơn hàng sản xuất',
    start_url:'.',
    display:'standalone',
    background_color:'#f8f7f5',
    theme_color:'#2563eb',
    lang:'vi',
    icons:[
      {src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='80' fill='%232563eb'/><text y='380' x='60' font-size='380' font-family='sans-serif'>📦</text></svg>",sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}
    ]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  document.getElementById('pwa-manifest').href=url;

  // 2. Đăng ký service worker (cache offline)
  if('serviceWorker' in navigator){
    const swCode=`
const CACHE='giathanh-v1';
const ASSETS=['/'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET') return;
  e.respondWith(caches.match(e.request).then(cached=>{
    const fresh=fetch(e.request).then(r=>{caches.open(CACHE).then(c=>c.put(e.request,r.clone()));return r;}).catch(()=>cached);
    return cached||fresh;
  }));
});`;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    const swURL=URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swURL).catch(()=>{});
  }

  // 3. Nút cài đặt
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault(); deferredPrompt=e;
    document.getElementById('btn-install').style.display='flex';
  });
  window.addEventListener('appinstalled',()=>{
    document.getElementById('btn-install').style.display='none';
    deferredPrompt=null;
  });
  document.getElementById('btn-install').addEventListener('click',()=>{
    if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;});}
  });
})();
</script>
