<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="Phần mềm theo dõi giá thành và đơn hàng sản xuất túi xách">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GiáThành Pro">
<title>GiáThành Pro – Theo dõi giá thành sản phẩm</title>
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text y='.9em' font-size='70' x='12'>📦</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<style>
:root {
  --bg:#f8f7f5; --card:#fff; --border:#e5e3de; --border2:#ccc;
  --text:#1c1917; --text2:#6b7280; --text3:#9ca3af;
  --accent:#2563eb; --accent-bg:#eff6ff; --accent-t:#1d4ed8;
  --danger:#dc2626; --danger-bg:#fef2f2;
  --success:#16a34a; --success-bg:#f0fdf4;
  --warn:#d97706; --warn-bg:#fffbeb;
  --sw:220px; --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg);display:flex;min-height:100vh}
/* SIDEBAR */
#sidebar{width:var(--sw);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:10}
.s-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.s-logo .a-name{font-size:15px;font-weight:700;color:var(--text)}
.s-logo .a-sub{font-size:11px;color:var(--text2);margin-top:2px}
.s-nav{padding:10px 8px;flex:1;overflow-y:auto}
.n-sec{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:12px 8px 4px}
.n-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px;margin-bottom:2px;transition:.12s}
.n-item:hover{background:var(--bg);color:var(--text)}
.n-item.active{background:var(--accent-bg);color:var(--accent-t);font-weight:500}
.n-item i{font-size:16px}
.s-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
/* MAIN */
#main{margin-left:var(--sw);flex:1;padding:28px 32px;min-height:100vh}
/* COMMON */
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.page-title{font-size:20px;font-weight:600}
.page-sub{font-size:13px;color:var(--text2);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:.12s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-t)}
.btn-sec{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-sec:hover{background:var(--bg);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--border);color:var(--text3)}
.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.btn-ghost{background:transparent;border:none;color:var(--text3);padding:5px 8px}
.btn-ghost:hover{color:var(--text);background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.card-p{padding:20px 24px}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.stat-lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.stat-val{font-size:26px;font-weight:600;margin-top:5px}
.stat-desc{font-size:12px;color:var(--text2);margin-top:2px}
/* TABLE */
.tbl-wrap{overflow-x:auto}
table.dtbl{width:100%;border-collapse:collapse}
.dtbl th{padding:9px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--bg)}
.dtbl td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px}
.dtbl tr:last-child td{border-bottom:none}
.dtbl tr:hover td{background:#fafaf9}
.dtbl .num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.b-blue{background:var(--accent-bg);color:var(--accent-t)}
.b-green{background:var(--success-bg);color:var(--success)}
.b-amber{background:var(--warn-bg);color:var(--warn)}
/* MODAL */
.mover{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center}
.mover.open{display:flex}
.mbox{background:var(--card);border-radius:14px;padding:24px;width:480px;max-width:96vw;max-height:90vh;overflow-y:auto}
.mbox-lg{width:640px}
.m-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.m-title{font-size:16px;font-weight:600}
.m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
/* FORM */
.fg{margin-bottom:13px}
.fl{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}
.fi{width:100%;padding:8px 11px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);background:var(--card);outline:none}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fr{display:grid;gap:12px}
.fr2{grid-template-columns:1fr 1fr}
/* DETAIL PAGE */
.d-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px}
.d-sec-hdr{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.d-sec-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.dtbl2{width:100%;border-collapse:collapse;table-layout:fixed}
.dtbl2 th{padding:8px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;background:var(--bg);border-bottom:1px solid var(--border)}
.dtbl2 td{padding:7px 9px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.dtbl2 input{width:100%;background:transparent;border:none;outline:none;font-size:13px;font-family:inherit;color:var(--text);padding:2px 0}
.dtbl2 input:focus{background:var(--accent-bg);padding:2px 5px;border-radius:4px}
.dtbl2 input[type=number]{text-align:right}
.dtbl2 .cro{background:var(--bg);color:var(--text2);text-align:right;font-size:13px;padding:7px 10px}
.dtbl2 select{width:100%;background:transparent;border:none;outline:none;font-size:13px;font-family:inherit;cursor:pointer;color:var(--text)}
/* SUMMARY */
.sum-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;align-items:center}
.sum-row.bt{border-top:1px solid var(--border);margin-top:4px;padding-top:12px}
.sum-hl{background:var(--accent-bg);padding:10px 16px;border-radius:8px;margin-top:6px;color:var(--accent-t);font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.pcti{width:46px;padding:2px 6px;border:1px solid var(--border2);border-radius:6px;font-size:13px;text-align:right;font-family:inherit;margin-left:5px;background:var(--card);color:var(--text)}
/* PICKER */
.ptbl{width:100%;border-collapse:collapse}
.ptbl td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer}
.ptbl tr:hover td{background:var(--accent-bg)}
/* BACK */
.back-nav{display:flex;align-items:center;gap:7px;color:var(--text2);font-size:13px;cursor:pointer;margin-bottom:18px}
.back-nav:hover{color:var(--text)}
/* EMPTY */
.empty{text-align:center;padding:55px 20px;color:var(--text2)}
.empty i{font-size:38px;margin-bottom:10px;display:block;color:var(--text3)}
.empty p{font-size:13px}
/* FACTORY CARD */
.fac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.fac-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
/* PROC ROW in modal */
.proc-row{display:grid;grid-template-columns:2fr 1fr 1.5fr auto;gap:8px;margin-bottom:8px;align-items:center}
/* IMAGE GALLERY */
.img-drop{border:2px dashed var(--border2);border-radius:10px;padding:26px 20px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg);margin:14px 16px}
.img-drop:hover,.img-drop.drag-over{border-color:var(--accent);background:var(--accent-bg)}
.img-drop i{font-size:30px;color:var(--text3);margin-bottom:6px;display:block}
.img-drop p{font-size:13px;color:var(--text2);margin-bottom:4px}
.img-drop span{font-size:11px;color:var(--text3)}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:0 16px 14px}
.img-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--bg);cursor:pointer}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.15s}
.img-thumb:hover img{opacity:.88}
.img-thumb .del-img{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);border:none;border-radius:6px;color:#fff;width:22px;height:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:0;transition:.15s;padding:0}
.img-thumb:hover .del-img{opacity:1}
.img-thumb .img-cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:10px;padding:14px 5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.img-thumb .img-num{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
.pv-over{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;cursor:zoom-out}
.pv-over.open{display:flex}
.pv-over img{max-width:88vw;max-height:88vh;border-radius:10px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pv-close{position:fixed;top:20px;right:24px;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pv-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#pv-prev{left:20px} #pv-next{right:20px}
/* thumb in product list */
.prod-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;border:1px solid var(--border);display:block}
.prod-thumb-empty{width:36px;height:36px;border-radius:6px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px}
@media print{
  #sidebar,.back-nav,.btn,.no-print{display:none!important}
  #main{margin-left:0;padding:10px}
  .d-sec{break-inside:avoid}
}
/* ORDER */
.dtbl2-in{width:100%;background:transparent;border:none;outline:none;font-size:13px;font-family:inherit;color:var(--text);padding:2px 0}
.dtbl2-in:focus{background:var(--accent-bg);padding:2px 5px;border-radius:4px}
.color-swatch{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);cursor:pointer;padding:2px;background:none}
.order-status-sel{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;outline:none;border:1px solid transparent}
.mat-matrix th{white-space:nowrap;font-size:11px}
.mat-matrix td{font-size:12px;font-variant-numeric:tabular-nums}
/* REMINDER */
.rmn-banner{display:flex;align-items:flex-start;gap:12px;padding:13px 18px;border-radius:10px;margin-bottom:16px;border:1px solid}
.rmn-banner.danger{background:#fff5f5;border-color:#fca5a5}
.rmn-banner.warn{background:#fffbeb;border-color:#fcd34d}
.rmn-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s}
.rmn-item:last-child{border-bottom:none}
.rmn-item:hover{background:var(--bg)}
.rmn-item.overdue{border-left:3px solid var(--danger)}
.rmn-item.today{border-left:3px solid var(--danger)}
.rmn-item.soon{border-left:3px solid var(--warn)}
.rmn-item.ok{border-left:3px solid var(--success)}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="s-logo">
    <div class="a-name">📦 GiáThành Pro</div>
    <div class="a-sub">Quản lý giá thành sản phẩm</div>
  </div>
  <nav class="s-nav">
    <div class="n-sec">Tổng quan</div>
    <div class="n-item" id="nav-dashboard" onclick="go('dashboard')"><i class="ti ti-layout-dashboard"></i>Tổng quan</div>
    <div class="n-sec">Quản lý</div>
    <div class="n-item" id="nav-products" onclick="go('products')"><i class="ti ti-tag"></i>Mã hàng thành phẩm</div>
    <div class="n-item" id="nav-orders" onclick="go('orders')"><i class="ti ti-clipboard-list"></i>Đơn hàng sản xuất</div>
    <div class="n-sec">Danh mục</div>
    <div class="n-item" id="nav-materials" onclick="go('materials')"><i class="ti ti-needle-thread"></i>Nguyên phụ liệu</div>
    <div class="n-item" id="nav-factories" onclick="go('factories')"><i class="ti ti-building-factory-2"></i>Xưởng gia công</div>
    <div class="n-sec">Hệ thống</div>
    <div class="n-item" id="nav-sync" onclick="go('sync')"><i class="ti ti-refresh"></i>Đồng bộ dữ liệu</div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
      <div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;padding:0 2px">Tìm nhanh mã hàng</div>
      <div style="position:relative">
        <i class="ti ti-search" style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none"></i>
        <input type="text" id="sidebar-search" placeholder="Nhập mã hoặc tên… (Ctrl+K)"
          oninput="sidebarSearch(this.value)"
          onkeydown="if(event.key==='Escape'){this.value='';sidebarSearch('')}"
          style="width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;box-sizing:border-box"
          onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
      </div>
      <div id="sidebar-results" style="margin-top:6px"></div>
    </div>
  </nav>
  <div class="s-foot">
    <!-- Nút cài đặt PWA -->
    <button id="btn-install" style="display:none;width:100%;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:9px;border:1.5px solid var(--accent);background:var(--accent-bg);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;font-family:inherit"
      onmouseover="this.style.background='var(--accent)';this.style.color='#fff'" onmouseout="this.style.background='var(--accent-bg)';this.style.color='var(--accent)'">
      <i class="ti ti-device-desktop-down" style="font-size:16px"></i>
      Cài đặt phần mềm
    </button>
    <!-- Sync status -->
    <div id="sync-status-bar" style="font-size:11px;color:var(--text2);padding:5px 2px 7px;display:flex;align-items:center;gap:6px">
      <span id="sync-dot" style="font-size:10px">⚪</span>
      <span id="sync-status-text">Đồng bộ tắt</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span><i class="ti ti-device-floppy" style="vertical-align:-2px"></i> Lưu cục bộ trên máy</span>
      <button id="bell-btn" onclick="toggleReminderPanel()" title="Nhắc nhở đơn hàng"
        style="background:transparent;border:none;cursor:pointer;position:relative;padding:4px 6px;border-radius:8px;color:var(--text2)"
        onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='transparent'">
        <i class="ti ti-bell" style="font-size:18px;vertical-align:-3px"></i>
        <span id="bell-badge" style="display:none;position:absolute;top:0;right:0;background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;line-height:16px;text-align:center;padding:0 3px"></span>
      </button>
    </div>
    <!-- REMINDER PANEL -->
    <div id="reminder-panel" style="display:none;position:fixed;bottom:54px;left:10px;width:310px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:50;overflow:hidden">
      <div style="padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center">
        <span><i class="ti ti-bell-ringing" style="color:var(--danger);vertical-align:-2px;margin-right:6px"></i>Nhắc nhở đơn hàng</span>
        <button onclick="toggleReminderPanel()" style="background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px 4px"><i class="ti ti-x"></i></button>
      </div>
      <div id="reminder-list" style="max-height:340px;overflow-y:auto"></div>
      <div style="padding:10px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);text-align:center">
        <i class="ti ti-info-circle" style="vertical-align:-2px"></i> Hiển thị đơn hàng trong vòng 3 ngày tới
      </div>
    </div>
  </div>
</aside>

<main id="main">
  <div id="reminder-banner"></div>
  <div id="pc"></div>
</main>

<!-- IMAGE PREVIEW -->
<div class="pv-over" id="pv-over" onclick="closePV(event)">
  <button class="pv-close" onclick="closePV()"><i class="ti ti-x"></i></button>
  <button class="pv-nav" id="pv-prev" onclick="pvNav(-1);event.stopPropagation()"><i class="ti ti-chevron-left"></i></button>
  <img id="pv-img" src="" alt="">
  <button class="pv-nav" id="pv-next" onclick="pvNav(1);event.stopPropagation()"><i class="ti ti-chevron-right"></i></button>
</div>
<!-- MODAL -->
<div class="mover" id="mover" onclick="closeM(event)">
  <div class="mbox" id="mbox" onclick="event.stopPropagation()">
    <div id="mini"></div>
  </div>
</div>

<script>
// ── DB ──
let db = {materials:[],factories:[],products:[],orders:[]};
let st = {page:'dashboard',pid:null};
const uid = () => Math.random().toString(36).slice(2,9);
const fmt = v => Math.round(v).toLocaleString('vi-VN')+' ₫';
const fmtN = v => Math.round(v).toLocaleString('vi-VN');
const today = () => new Date().toLocaleDateString('vi-VN');
const GP = id => db.products.find(p=>p.id===id);

function loadDB(){
  try{const d=localStorage.getItem('gt_db');if(d){db=JSON.parse(d);if(!db.orders)db.orders=[];}}catch(e){}
}
function saveDB(){
  localStorage.setItem('gt_db',JSON.stringify(db));
  // Debounce: chờ 3 giây sau lần save cuối rồi push lên cloud
  clearTimeout(_pushDebounce);
  _pushDebounce=setTimeout(pushSync,3000);
}

// ── NAV ──
function go(page,id=null){
  st.page=page; st.pid=id;
  document.querySelectorAll('.n-item').forEach(e=>e.classList.remove('active'));
  const key=page==='detail'?'products':page==='order-detail'?'orders':page;
  const el=document.getElementById('nav-'+key);
  if(el) el.classList.add('active');
  render();
}
function render(){
  const el=document.getElementById('pc');
  if(st.page==='dashboard') el.innerHTML=pDash();
  else if(st.page==='products') el.innerHTML=pProducts();
  else if(st.page==='detail'){el.innerHTML=pDetail(st.pid);bindDetail(st.pid);}
  else if(st.page==='materials') el.innerHTML=pMaterials();
  else if(st.page==='factories') el.innerHTML=pFactories();
  else if(st.page==='orders') el.innerHTML=pOrders();
  else if(st.page==='order-detail') el.innerHTML=pOrderDetail(st.pid);
  else if(st.page==='sync') el.innerHTML=pSync();
  updateReminders();
}

// ── CALC ──
function calc(p){
  const qty=p.qty||1;
  const npl=(p.bom||[]).reduce((s,r)=>s+(r.dm||0)*(r.price||0)*(1+(r.hh||0)/100),0);
  const gc=(p.processes||[]).reduce((s,r)=>s+(r.price||0),0);
  const vc=(p.shipping||[]).reduce((s,r)=>s+(r.total>0?r.total/qty:(r.perUnit||0)),0);
  const cost=npl+gc+vc;
  const oh=cost*((p.overheadPct??10)/100);
  const base=cost+oh;
  const pr=base*((p.profitPct??20)/100);
  const sale=base+pr;
  const ref=sale||1;
  const pNpl=npl/ref*100,pGc=gc/ref*100,pVc=vc/ref*100,pOh=oh/ref*100,pPr=pr/ref*100;

  // Chi phí đối tác bán hàng (% trên giá bán thực tế)
  const actual=p.actualPrice||0;
  const partnerPct=p.partnerCostPct||0;
  const partnerCost=actual>0?actual*partnerPct/100:0;

  // Lợi nhuận thực sau khi trừ chi phí đối tác
  const actProfit=actual>0?actual-base-partnerCost:null;
  const actPct=actual>0&&actProfit!==null?(actProfit/actual*100):null;
  const actVsSug=actual>0?((actual-sale)/sale*100):null;
  const actStatus=actProfit===null?null:actProfit>0?'lãi':actProfit<0?'lỗ':'hòa vốn';

  const fixedCost=p.fixedCost||0;
  const priceRef=actual>0?actual:sale;
  const marginUnit=priceRef-base-partnerCost;
  const breakEven=fixedCost>0&&marginUnit>0?Math.ceil(fixedCost/marginUnit):null;
  const beRevenue=breakEven?breakEven*priceRef:null;
  return{npl,gc,vc,cost,oh,profit:pr,sale,
    pNpl,pGc,pVc,pOh,pPr,
    actual,partnerCost,partnerPct,
    actProfit,actPct,actVsSug,actStatus,
    fixedCost,breakEven,beRevenue,marginUnit};
}

  let totalQty=0, totalEst=0, totalAct=0, totalRev=0, totalRevAct=0, cntAct=0;
  activeOrders.forEach(o=>{
    const p=GP(o.productId); if(!p) return;
    const c=calc(p);
    const qty=(o.colors||[]).filter(cl=>cl.siType!=='phu').reduce((s,cl)=>s+(cl.qty||0),0);
    totalQty += qty;
    totalEst += c.profit*qty;

  // Nhóm đơn hàng theo tháng (dùng createdAt)
  function parseMonth(s){
    if(!s) return '00/0000';
    const p=s.split('/');
    return p.length>=3?String(+p[1]).padStart(2,'0')+'/'+p[2]:'00/0000';
  }
  function monthLabel(key){
    if(key==='00/0000') return 'Không rõ';
    const[mm,yyyy]=key.split('/');
    return `Tháng ${+mm}/${yyyy}`;
  }

  const monthMap={};
  O.forEach(o=>{
    const key=parseMonth(o.createdAt);
    if(!monthMap[key]) monthMap[key]={orders:[],qty:0,est:0,act:0,actCnt:0,rev:0};
    const g=monthMap[key];
    g.orders.push(o);
    const p=GP(o.productId);
    if(p){
      const c=calc(p);
      const qty=(o.colors||[]).filter(cl=>cl.siType!=='phu').reduce((s,cl)=>s+(cl.qty||0),0);

function highlight(text, q){
  if(!q||!text) return text||'';
  const idx=text.toLowerCase().indexOf(q.toLowerCase());
  if(idx<0) return text;
  return text.slice(0,idx)+`<mark style="background:#fef08a;border-radius:2px;padding:0 1px">${text.slice(idx,idx+q.length)}</mark>`+text.slice(idx+q.length);
}

function renderProdTable(){
  const q=_prodQ.trim().toLowerCase();
  const filtered=q
    ? db.products.filter(p=>(p.code||'').toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q))
    : db.products;

  const wrap=document.getElementById('prod-table-wrap');
  if(wrap) wrap.innerHTML=db.products.length===0
    ?'<div class="empty"><i class="ti ti-tag"></i><p>Chưa có mã hàng nào.</p></div>'
    :prodTableHTML(filtered);

  const info=document.getElementById('search-info');
  if(info) info.textContent=q?`Tìm thấy ${filtered.length} / ${db.products.length} mã hàng`:'';

  const clr=document.getElementById('search-clear');
  if(clr) clr.style.display=_prodQ?'flex':'none';

  <!-- NPL — TÁCH 3 NHÓM -->
  ${(()=>{
    // Dùng siType làm trường phân loại chính

    const getType=r=>{
      if(r.siType) return r.siType;
      if((r.matCode||'').toUpperCase().startsWith('S')) return 'chinh';
      return 'pk';
    };
    const bomSiC=(p.bom||[]).map((r,i)=>({...r,_i:i})).filter(r=>getType(r)==='chinh');
    const bomSiP=(p.bom||[]).map((r,i)=>({...r,_i:i})).filter(r=>getType(r)==='phu');
    const bomPK =(p.bom||[]).map((r,i)=>({...r,_i:i})).filter(r=>getType(r)==='pk');

    const thead=`<table class="dtbl2" style="table-layout:auto">
      <thead><tr><th>Mã NPL</th><th>Tên NPL</th><th>ĐVT</th><th>Định mức</th><th>Giá nhập (₫)</th><th>Hao hụt %</th><th>Thành tiền</th><th class="no-print"></th></tr></thead>`;

    const bomRow=(r,i)=>`<tr>
      <td><input value="${r.matCode||''}" onchange="updBOM('${id}',${i},'matCode',this.value)" style="color:var(--text2);font-size:12px;width:100%"></td>
      <td><input value="${r.matName||''}" onchange="updBOM('${id}',${i},'matName',this.value)"></td>
      <td><select onchange="updBOM('${id}',${i},'unit',this.value)">${UNITS.map(u=>`<option${r.unit===u?' selected':''}>${u}</option>`).join('')}</select></td>
      <td><input type="number" value="${r.dm||0}" step="0.001" onchange="updBOM('${id}',${i},'dm',+this.value)"></td>
      <td><input type="number" value="${r.price||0}" onchange="updBOM('${id}',${i},'price',+this.value)"></td>
      <td><input type="number" value="${r.hh||0}" step="0.1" min="0" max="100" onchange="updBOM('${id}',${i},'hh',+this.value)"></td>
      <td class="cro" id="b-tt-${i}">${fmt((r.dm||0)*(r.price||0)*(1+(r.hh||0)/100))}</td>
      <td class="no-print"><button class="btn btn-ghost btn-sm" onclick="delBOM('${id}',${i})"><i class="ti ti-x"></i></button></td>
    </tr>`;

    const subTotal=rows=>rows.reduce((s,r)=>s+(r.dm||0)*(r.price||0)*(1+(r.hh||0)/100),0);
    const emptyMsg=txt=>`<div style="padding:6px 16px 10px;font-size:12px;color:var(--text3)">${txt}</div>`;

    return`
    <div class="d-sec">
      <div class="d-sec-hdr">
        <div class="d-sec-title"><i class="ti ti-needle-thread" style="color:var(--success)"></i>Nguyên phụ liệu
          <span class="badge b-green" style="font-size:11px">${(p.bom||[]).length} dòng</span>
        </div>
      </div>

      <!-- SỈ CHÍNH -->
      <div style="background:#fff5f5;border-bottom:1px solid var(--border)">
        <div style="padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:12px;font-weight:700;color:#e11d48;display:flex;align-items:center;gap:5px">
            <i class="ti ti-circle-filled" style="font-size:10px"></i>Sỉ chính
          </span>
          <span style="font-size:12px;color:var(--text2)">Mã:</span>
          <input value="${p.siChinhCode||''}" placeholder="VD: SC-001"
            onchange="updF('${id}','siChinhCode',this.value)"
            style="padding:3px 8px;border:1px solid #fca5a5;border-radius:6px;font-size:12px;font-weight:600;color:#e11d48;font-family:inherit;background:#fff;width:110px">
          <span style="font-size:11px;color:var(--text2);margin-left:auto">${bomSiC.length} dòng &nbsp;·&nbsp; ${fmt(subTotal(bomSiC))}</span>
          <button class="btn btn-sm no-print" style="background:#fff1f2;color:#e11d48;border:1px solid #fca5a5;font-size:11px" onclick="openPickNPLFiltered('${id}','chinh','si')">
            <i class="ti ti-database-search"></i> Chọn từ Định mức Sỉ
          </button>
        </div>
        ${bomSiC.length ? thead+'<tbody>'+bomSiC.map(r=>bomRow(r,r._i)).join('')+'</tbody></table>' : emptyMsg('Chưa có dòng nào')}
        <div style="padding:6px 10px" class="no-print">
          <button class="btn btn-ghost btn-sm" onclick="addBOMTyped('${id}','chinh')"><i class="ti ti-plus"></i> Thêm dòng thủ công</button>
        </div>
      </div>

      <!-- SỈ PHỤ -->
      <div style="background:#fef9ec;border-bottom:1px solid var(--border)">
        <div style="padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:12px;font-weight:700;color:#d97706;display:flex;align-items:center;gap:5px">
            <i class="ti ti-circle" style="font-size:10px"></i>Sỉ phụ
          </span>
          <span style="font-size:12px;color:var(--text2)">Mã:</span>
          <input value="${p.siphuCode||''}" placeholder="VD: SP-001"
            onchange="updF('${id}','siphuCode',this.value)"
            style="padding:3px 8px;border:1px solid #fcd34d;border-radius:6px;font-size:12px;font-weight:600;color:#d97706;font-family:inherit;background:#fff;width:110px">
          <span style="font-size:11px;color:var(--text2);margin-left:auto">${bomSiP.length} dòng &nbsp;·&nbsp; ${fmt(subTotal(bomSiP))}</span>
          <button class="btn btn-sm no-print" style="background:#fef9ec;color:#d97706;border:1px solid #fcd34d;font-size:11px" onclick="openPickNPLFiltered('${id}','phu','si')">
            <i class="ti ti-database-search"></i> Chọn từ Định mức Sỉ
          </button>
        </div>
        ${bomSiP.length ? thead+'<tbody>'+bomSiP.map(r=>bomRow(r,r._i)).join('')+'</tbody></table>' : emptyMsg('Chưa có dòng nào')}
        <div style="padding:6px 10px" class="no-print">
          <button class="btn btn-ghost btn-sm" onclick="addBOMTyped('${id}','phu')"><i class="ti ti-plus"></i> Thêm dòng thủ công</button>
        </div>
      </div>

      <!-- PHỤ KIỆN -->
      <div>
        <div style="padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--success-bg);border-bottom:1px solid var(--border)">
          <span style="font-size:12px;font-weight:700;color:var(--success);display:flex;align-items:center;gap:5px">
            <i class="ti ti-package" style="font-size:13px"></i>Phụ kiện (PK)
          </span>
          <span style="font-size:11px;color:var(--text2);margin-left:auto">${bomPK.length} dòng &nbsp;·&nbsp; ${fmt(subTotal(bomPK))}</span>
          <button class="btn btn-sm no-print" style="background:var(--success-bg);color:var(--success);border:1px solid #86efac;font-size:11px" onclick="openPickNPLFiltered('${id}','pk','npl')">
            <i class="ti ti-database-search"></i> Chọn từ Định mức NPL
          </button>
        </div>
        ${bomPK.length ? thead+'<tbody>'+bomPK.map(r=>bomRow(r,r._i)).join('')+'</tbody></table>' : emptyMsg('Chưa có dòng nào')}
        <div style="padding:6px 10px" class="no-print">
          <button class="btn btn-ghost btn-sm" onclick="addBOM('${id}')"><i class="ti ti-plus"></i> Thêm dòng thủ công</button>
        </div>
      </div>

      <!-- TỔNG -->
      <div style="padding:9px 16px;border-top:2px solid var(--border);background:var(--bg);display:flex;gap:20px;font-size:13px;flex-wrap:wrap">
        <span style="color:var(--text2)">Tổng NPL:</span>
        <span>Sỉ chính: <b style="color:#e11d48">${fmt(subTotal(bomSiC))}</b></span>
        <span>Sỉ phụ: <b style="color:#d97706">${fmt(subTotal(bomSiP))}</b></span>
        <span>Phụ kiện: <b style="color:var(--success)">${fmt(subTotal(bomPK))}</b></span>
        <span style="margin-left:auto;font-weight:700">Tổng: <b style="color:var(--accent)">${fmt(subTotal([...bomSiC,...bomSiP,...bomPK]))}</b></span>
      </div>
    </div>`;
  })()}

  <!-- GC -->
  <div class="d-sec">
    <div class="d-sec-hdr">
      <div class="d-sec-title"><i class="ti ti-building-factory-2" style="color:var(--accent)"></i>Chi phí gia công
        <span class="badge b-blue" style="font-size:11px">${(p.processes||[]).length} công đoạn</span>
      </div>
      <button class="btn btn-sec btn-sm no-print" onclick="openPickGC('${id}')"><i class="ti ti-database-search"></i> Chọn từ xưởng</button>
    </div>
    <table class="dtbl2">
      <colgroup><col style="width:14%"><col style="width:22%"><col style="width:24%"><col style="width:14%"><col style="width:19%"><col style="width:7%"></colgroup>
      <thead><tr><th>Mã xưởng</th><th>Tên xưởng</th><th>Công đoạn</th><th>ĐVT</th><th>Đơn giá (₫)</th><th class="no-print"></th></tr></thead>
      <tbody id="gc-body">
        ${(p.processes||[]).map((r,i)=>{
          const fac=db.factories.find(f=>f.code===r.facCode);
          const procs=fac?(fac.processes||[]):[];
          const procField=procs.length
            ?`<select id="proc-sel-${id}-${i}" onchange="applyProc('${id}',${i},this.value)"
                style="width:100%;background:transparent;border:none;outline:none;font-size:13px;font-family:inherit;cursor:pointer;color:var(--text)">
                <option value="">-- Chọn công đoạn --</option>
                ${procs.map(pr=>`<option value="${pr.name}" ${r.processName===pr.name?'selected':''}>${pr.name}</option>`).join('')}
              </select>`
            :`<input id="proc-sel-${id}-${i}" value="${r.processName||''}" placeholder="Công đoạn..."
                onchange="updGC('${id}',${i},'processName',this.value)"
                style="width:100%">`;
          return`<tr>
          <td>
            <input value="${r.facCode||''}" placeholder="Mã xưởng..."
              style="color:var(--accent-t);font-size:12px;font-weight:600;width:100%"
              oninput="autoFillFac('${id}',${i},this.value)"
              onchange="updGC('${id}',${i},'facCode',this.value)">
          </td>
          <td><input id="fac-name-${id}-${i}" value="${r.facName||''}" placeholder="Tên xưởng..."
            onchange="updGC('${id}',${i},'facName',this.value)" style="font-weight:500"></td>
          <td id="proc-cell-${id}-${i}">${procField}</td>
          <td><input id="gc-unit-${id}-${i}" value="${r.unit||'công/sp'}" onchange="updGC('${id}',${i},'unit',this.value)"></td>
          <td><input id="gc-price-${id}-${i}" type="number" value="${r.price||0}" onchange="updGC('${id}',${i},'price',+this.value)"></td>
          <td class="no-print"><button class="btn btn-ghost btn-sm" onclick="delGC('${id}',${i})"><i class="ti ti-x"></i></button></td>
        </tr>`;}).join('')}
      </tbody>
    </table>
    <div style="padding:7px 10px" class="no-print">
      <button class="btn btn-ghost btn-sm" onclick="addGC('${id}')"><i class="ti ti-plus"></i> Thêm dòng thủ công</button>
    </div>
  </div>

  <!-- VC -->
  <div class="d-sec">
    <div class="d-sec-hdr">
      <div class="d-sec-title"><i class="ti ti-truck" style="color:var(--warn)"></i>Chi phí vận chuyển</div>
      <button class="btn btn-sec btn-sm no-print" onclick="addVC('${id}')"><i class="ti ti-plus"></i> Thêm</button>
    </div>
    <table class="dtbl2">
      <colgroup><col style="width:26%"><col style="width:20%"><col style="width:18%"><col style="width:18%"><col style="width:12%"><col style="width:6%"></colgroup>
      <thead><tr><th>Nội dung</th><th>Loại chi phí</th><th>Tổng lô (₫)</th><th>Đơn giá/sp (₫)</th><th>Phân bổ/sp</th><th class="no-print"></th></tr></thead>
      <tbody id="vc-body">
        ${(p.shipping||[]).map((r,i)=>{
          const VCT=['Vận chuyển nội địa','Vận chuyển quốc tế','Phí hải quan','Phí lưu kho','Phí bảo hiểm','Phí bốc xếp','Khác'];
          const ps=r.total>0?r.total/qty:(r.perUnit||0);
          return`<tr>
            <td><input value="${r.name||''}" placeholder="Mô tả..." onchange="updVC('${id}',${i},'name',this.value)"></td>
            <td><select onchange="updVC('${id}',${i},'type',this.value)">${VCT.map(t=>`<option${r.type===t?' selected':''}>${t}</option>`).join('')}</select></td>
            <td><input type="number" value="${r.total||''}" placeholder="Tổng lô" onchange="updVC('${id}',${i},'total',+this.value)"></td>
            <td><input type="number" value="${r.perUnit||''}" placeholder="hoặc/sp" onchange="updVC('${id}',${i},'perUnit',+this.value)"></td>
            <td class="cro" id="v-tt-${i}">${fmt(ps)}</td>
            <td class="no-print"><button class="btn btn-ghost btn-sm" onclick="delVC('${id}',${i})"><i class="ti ti-x"></i></button></td>
          </tr>`;}).join('')}
      </tbody>
    </table>
    <div style="padding:7px 12px;background:var(--bg);font-size:12px;color:var(--text2);border-top:1px solid var(--border)" class="no-print">
      <i class="ti ti-info-circle" style="vertical-align:-2px"></i> Nhập tổng lô để tự phân bổ theo số lượng, hoặc nhập đơn giá/sp trực tiếp.
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="card card-p" id="sum-sec">${sumHTML(p)}</div>`;
}

function sumHTML(p){
  const c=calc(p),qty=p.qty||1;
  const bar=pct=>Math.max(0,Math.min(100,pct)).toFixed(1);
  const sign=v=>v>0?'+'+v.toFixed(1):v.toFixed(1);
  const fmtPct=v=>v===null?'—':v.toFixed(1)+'%';

  // Breakdown bar segments
  const segs=[
    {pct:c.pNpl,color:'#16a34a',label:'NPL'},
    {pct:c.pGc, color:'#2563eb',label:'GC'},
    {pct:c.pVc, color:'#d97706',label:'VC'},
    {pct:c.pOh, color:'#6b7280',label:'QL'},
    {pct:c.pPr, color:'#7c3aed',label:'LN'},
  ];
  const barHTML=segs.map(s=>`<div style="width:${bar(s.pct)}%;background:${s.color};display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:600;transition:.3s;min-width:${s.pct>3?'0':'0'}px" title="${s.label}: ${s.pct.toFixed(1)}%">${s.pct>=5?s.pct.toFixed(0)+'%':''}</div>`).join('');
  const legHTML=segs.map(s=>`<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)"><span style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block"></span>${s.label} ${s.pct.toFixed(1)}%</div>`).join('');

  // Actual profit section
  const hasActual=c.actual>0;
  const actColor=c.actStatus==='lãi'?'var(--success)':c.actStatus==='lỗ'?'var(--danger)':'var(--warn)';
  const actIcon=c.actStatus==='lãi'?'ti-trending-up':c.actStatus==='lỗ'?'ti-trending-down':'ti-minus';
  const actBg=c.actStatus==='lãi'?'var(--success-bg)':c.actStatus==='lỗ'?'var(--danger-bg)':'var(--warn-bg)';

  return`
  <div style="font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px">
    <i class="ti ti-report-money"></i>Tổng hợp giá thành & Phân tích lợi nhuận
  </div>

  <!-- COST SUMMARY -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start">
  <div>
    <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Cơ cấu chi phí</div>
    <div class="sum-row"><span style="color:var(--text2)">Chi phí NPL / sp</span><span style="font-weight:500">${fmt(c.npl)}</span></div>
    <div class="sum-row"><span style="color:var(--text2)">Chi phí gia công / sp</span><span style="font-weight:500">${fmt(c.gc)}</span></div>
    <div class="sum-row"><span style="color:var(--text2)">Chi phí vận chuyển / sp</span><span style="font-weight:500;color:var(--warn)">${fmt(c.vc)}</span></div>
    <div class="sum-row bt"><span style="font-weight:600">Giá thành sản xuất / sp</span><span style="font-weight:700;color:var(--accent)">${fmt(c.cost)}</span></div>
    <div class="sum-row">
      <span style="color:var(--text2)">Chi phí QL & bán hàng <input type="number" value="${p.overheadPct??10}" min="0" max="100" class="pcti" onchange="updF('${p.id}','overheadPct',+this.value)">%</span>
      <span>${fmt(c.oh)}</span>
    </div>
    <div class="sum-row">
      <span style="color:var(--text2)">LN dự kiến <input type="number" value="${p.profitPct??20}" min="0" max="100" class="pcti" onchange="updF('${p.id}','profitPct',+this.value)">%</span>
      <span style="color:#7c3aed;font-weight:500">${fmt(c.profit)}</span>
    </div>
    <div class="sum-hl"><span>Giá bán đề xuất / sp</span><span>${fmt(c.sale)}</span></div>
  </div>

  <!-- BREAKDOWN BAR -->
  <div>
    <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Biểu đồ cơ cấu giá bán</div>
    <div style="display:flex;height:28px;border-radius:8px;overflow:hidden;gap:1px;margin-bottom:8px">${barHTML}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">${legHTML}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="stat-card" style="padding:10px 12px">
        <div class="stat-lbl">Giá thành/sp</div>
        <div style="font-size:15px;font-weight:600;margin-top:3px">${fmtN(c.cost)} ₫</div>
      </div>
      <div class="stat-card" style="padding:10px 12px;border-color:var(--accent)">
        <div class="stat-lbl">Giá bán đề xuất</div>
        <div style="font-size:15px;font-weight:600;margin-top:3px;color:var(--accent)">${fmtN(c.sale)} ₫</div>
      </div>
      <div class="stat-card" style="padding:10px 12px">
        <div class="stat-lbl">LN dự kiến/sp</div>
        <div style="font-size:15px;font-weight:600;margin-top:3px;color:#7c3aed">${fmtN(c.profit)} ₫</div>
      </div>
      <div class="stat-card" style="padding:10px 12px">
        <div class="stat-lbl">Tổng lô (${qty} sp)</div>
        <div style="font-size:15px;font-weight:600;margin-top:3px">${fmtN(c.sale*qty)} ₫</div>
      </div>
    </div>
  </div>
  </div>

  <!-- ACTUAL PRICE ANALYSIS -->
  <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border)">
    <div style="font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)">
      <i class="ti ti-currency-dong" style="font-size:16px"></i>Giá bán thực tế & Lợi nhuận thực
    </div>

    <!-- NHẬP GIÁ BÁN + CHI PHÍ ĐỐI TÁC -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div style="background:var(--bg);border-radius:10px;padding:12px 14px">
        <div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Giá bán thực tế / sp</div>
        <input type="number" value="${p.actualPrice||''}" placeholder="Nhập giá bán thực tế..." min="0"
          style="padding:7px 12px;border:1px solid var(--border2);border-radius:8px;font-size:14px;font-family:inherit;width:100%;color:var(--text);font-weight:600"
          onchange="updF('${p.id}','actualPrice',+this.value)">
        ${hasActual?`<div style="font-size:11px;color:var(--text2);margin-top:5px">So với đề xuất: <b style="color:${c.actVsSug>=0?'var(--success)':'var(--danger)'}">${sign(c.actVsSug)}%</b></div>`:''}
      </div>
      <div style="background:#fef3c7;border-radius:10px;padding:12px 14px;border:1px solid #fcd34d44">
        <div style="font-size:11px;font-weight:600;color:#92400e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">
          <i class="ti ti-users" style="font-size:12px;vertical-align:-1px"></i> Chi phí đối tác bán hàng
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <input type="number" value="${p.partnerCostPct||0}" min="0" max="100" step="0.1"
            style="padding:7px 10px;border:1px solid #fcd34d;border-radius:8px;font-size:14px;font-family:inherit;width:80px;color:var(--text);font-weight:600;text-align:right"
            onchange="updF('${p.id}','partnerCostPct',+this.value)">
          <span style="font-size:14px;font-weight:600;color:#92400e">%</span>

function openM(html,lg=false){
  document.getElementById('mini').innerHTML=html;
  document.getElementById('mbox').className='mbox'+(lg?' mbox-lg':'');
  document.getElementById('mover').classList.add('open');
}
function closeM(e){
  if(!e||e.target===document.getElementById('mover'))
    document.getElementById('mover').classList.remove('open');
}

// Product modal
function genProductCode(){
  const PREFIX='TXV-';
  // Tìm số lớn nhất trong tất cả mã hàng có prefix TXV-
  let max=0;
  db.products.forEach(p=>{
    if((p.code||'').toUpperCase().startsWith(PREFIX)){
      const n=parseInt((p.code||'').slice(PREFIX.length))||0;
      if(n>max) max=n;
    }
  });
  // Bắt đầu từ 003 nếu chưa có mã nào (theo yêu cầu hiện tại đang là 003)
  if(max===0) max=3;
  return PREFIX+String(max+1).padStart(3,'0');
}

function saveProd(id){
  const code=document.getElementById('f-pc').value.trim();

  if(!code||!name) return alert('Vui lòng nhập đầy đủ mã hàng và tên sản phẩm.');

// Material modal
function genSiCode(){
  const PREFIX='S';
  let max=4; // hiện tại đang là S004
  db.materials.forEach(m=>{
    const c=(m.code||'').toUpperCase();
    if(c.startsWith(PREFIX) && /^S\d+$/.test(c)){
      const n=parseInt(c.slice(PREFIX.length))||0;
      if(n>max) max=n;
    }
  });
  return PREFIX+String(max+1).padStart(3,'0'); // S005, S006...
}

function genMatCode(){
  const PREFIX='PK-';
  let max=12; // hiện tại đang là PK-012
  db.materials.forEach(m=>{
    if((m.code||'').toUpperCase().startsWith(PREFIX)){
      const n=parseInt((m.code||'').slice(PREFIX.length))||0;
      if(n>max) max=n;
    }
  });
  return PREFIX+String(max+1).padStart(3,'0');
}

    : (type||'npl');

  const autoCode = m ? m.code : (isSi ? genSiCode() : genMatCode());
  const accentColor = isSi ? '#e11d48' : 'var(--success)';
  const UNITS=['m','m²','dm²','kg','g','cái','đôi','cuộn','tờ','bộ','cây','túi'];
  openM(`<div class="m-hdr">
    <div class="m-title" style="color:${accentColor}">${m?(isSi?'Sửa Sỉ':'Sửa NPL'):(isSi?'Thêm định mức Sỉ':'Thêm nguyên phụ liệu')}</div>

    <div class="fg">
      <label class="fl">Mã ${isSi?'Sỉ':'NPL'}</label>
      <div style="position:relative">
        <input class="fi" id="f-mc" value="${autoCode}"

        ${!m?`<button onclick="document.getElementById('f-mc').value=${isSi?'genSiCode':'genMatCode'}()" title="Tạo mã mới"
          style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px"

        </button>`:''}
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">${isSi?'Dạng S001, S002…':'Dạng PK-013, PK-014…'} — có thể sửa tay</div>

function saveMat(id){
  const code=document.getElementById('f-mc').value.trim();
  const name=document.getElementById('f-mn').value.trim();
  if(!code||!name) return alert('Vui lòng nhập mã và tên NPL.');

  saveDB();closeM();render();
}
function delMat(id){

  db.materials=db.materials.filter(x=>x.id!==id);
  saveDB();render();

// ── XUẤT EXCEL ──
async function exportOrderExcel(id){
  if(typeof ExcelJS==='undefined'){alert('Đang tải thư viện, vui lòng thử lại.');return;}
  const o=db.orders.find(x=>x.id===id); if(!o) return;
  const p=GP(o.productId);
  const mats=calcOrderMats(o);
  const allColors=o.colors||[];
  const colorsChinh=allColors.map((c,ci)=>({...c,_ci:ci})).filter(c=>c.siType!=='phu');
  const colorsPhu  =allColors.map((c,ci)=>({...c,_ci:ci})).filter(c=>c.siType==='phu');
  const matsSiChinh=mats.filter(m=>m.isSiChinh);
  const matsSiPhu  =mats.filter(m=>m.isSiPhu);
  const matsPK     =mats.filter(m=>!m.isSi);
  const dateStr=new Date().toLocaleDateString('vi-VN');
  const getNCC=code=>db.materials.find(m=>m.code===code)?.supplier||'—';

  const wb=new ExcelJS.Workbook();
  wb.creator='GiáThành Pro'; wb.created=new Date();

  // Đăng ký ảnh sản phẩm vào workbook (dùng chung cho mọi sheet)
  let imgId=null;
  if(p&&(p.images||[]).length){
    const raw=p.images[0].data||'';
    const m2=raw.match(/^data:image\/(\w+);base64,(.+)$/);
    if(m2){try{imgId=wb.addImage({base64:m2[2],extension:m2[1]==='jpg'?'jpeg':m2[1]});}catch(e){}}
  }

  // Helper: viết header + chèn ảnh, trả về dòng dữ liệu bắt đầu (1-based)
  const IMG_ROWS=9;
  // Lấy danh sách xưởng gia công từ quy trình của sản phẩm
  const factories_gc=[...new Set((p?p.processes||[]:[]).map(pr=>pr.facName||pr.facCode||'').filter(Boolean))];
  const facStr=factories_gc.length?factories_gc.join(', '):'—';

  function writeHeader(ws){
    const boldStyle={font:{bold:true,size:11}};
    const r1=ws.getRow(1); r1.getCell(1).value=`Số đơn hàng: ${o.orderCode}`; Object.assign(r1.getCell(1),boldStyle); r1.height=20;
    const r2=ws.getRow(2); r2.getCell(1).value=`Sản phẩm: ${p?`${p.code} – ${p.name}`:'—'}`; r2.height=18;
    const r3=ws.getRow(3); r3.getCell(1).value=`Ngày xuất: ${dateStr}`; r3.height=18;
    const r4=ws.getRow(4); r4.getCell(1).value=`Xưởng gia công: ${facStr}`; r4.height=18;
    if(imgId!==null){
      ws.addImage(imgId,{tl:{col:0.1,row:4.2},ext:{width:160,height:128}});
      for(let r=5;r<=5+IMG_ROWS-1;r++) ws.getRow(r).height=15;
      ws.getRow(5+IMG_ROWS).height=6;
      return 5+IMG_ROWS+1;
    }
    ws.getRow(5).height=6;
    return 6;
  }

  // Helper: style dòng header cột
  function styleHdr(row){
    row.eachCell(c=>{
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A202C'}};
      c.font={bold:true,color:{argb:'FFFFFFFF'},size:10};
      c.alignment={vertical:'middle',horizontal:'center',wrapText:true};
    });
    row.height=30;
  }

  // Helper: label nhóm
  function groupLabel(ws,r,text,argb){
    const c=ws.getRow(r).getCell(1);
    c.value=text; c.font={bold:true,size:11,color:{argb}};
    ws.getRow(r).height=22;
  }

  // ── SHEET 1: BẢNG SỈ ──
  const ws1=wb.addWorksheet('Bảng Sỉ');
  const nMax=Math.max(colorsChinh.length,colorsPhu.length,1);
  ws1.columns=[{width:14},...Array(nMax).fill(null).map(()=>({width:14})),{width:14},{width:18},{width:28}];
  let r=writeHeader(ws1);

  // SỈ CHÍNH
  groupLabel(ws1,r,'SỈ CHÍNH','FFE11D48'); r++;
  const hSC=ws1.getRow(r); hSC.getCell(1).value='Mã NPL';
  colorsChinh.forEach((c,i)=>hSC.getCell(i+2).value=`${c.colorCode||'?'}\n(${(c.qty||0).toLocaleString()} sp)`);
  hSC.getCell(colorsChinh.length+2).value='Giá nhập (₫)';
  hSC.getCell(colorsChinh.length+3).value='Thành tiền (₫)';
  hSC.getCell(colorsChinh.length+4).value='Nhà cung cấp';
  styleHdr(hSC); r++;
  matsSiChinh.forEach(m=>{
    const row=ws1.getRow(r);
    row.getCell(1).value=m.matCode||'—';
    colorsChinh.forEach((c,i)=>row.getCell(i+2).value=m.byColor[c._ci]>0?+m.byColor[c._ci].toFixed(2):0);
    row.getCell(colorsChinh.length+2).value=m.price||0;
    row.getCell(colorsChinh.length+3).value=+(m.toBuy*(m.price||0)).toFixed(0);
    row.getCell(colorsChinh.length+4).value=getNCC(m.matCode);
    row.height=18; r++;
  });
  r++; // dòng trống

  // SỈ PHỤ
  groupLabel(ws1,r,'SỈ PHỤ','FFD97706'); r++;
  const hSP=ws1.getRow(r); hSP.getCell(1).value='Mã NPL';
  colorsPhu.forEach((c,i)=>hSP.getCell(i+2).value=`${c.colorCode||'?'}\n(${(c.qty||0).toLocaleString()} sp)`);
  hSP.getCell(colorsPhu.length+2).value='Giá nhập (₫)';
  hSP.getCell(colorsPhu.length+3).value='Thành tiền (₫)';
  hSP.getCell(colorsPhu.length+4).value='Nhà cung cấp';
  styleHdr(hSP); r++;
  matsSiPhu.forEach(m=>{
    const row=ws1.getRow(r);
    row.getCell(1).value=m.matCode||'—';
    colorsPhu.forEach((c,i)=>row.getCell(i+2).value=m.byColor[c._ci]>0?+m.byColor[c._ci].toFixed(2):0);
    row.getCell(colorsPhu.length+2).value=m.price||0;
    row.getCell(colorsPhu.length+3).value=+(m.toBuy*(m.price||0)).toFixed(0);
    row.getCell(colorsPhu.length+4).value=getNCC(m.matCode);
    row.height=18; r++;
  });

  // ── SHEET 2: NGUYÊN PHỤ LIỆU ──
  const ws2=wb.addWorksheet('Nguyên phụ liệu');
  ws2.columns=[{width:12},{width:30},{width:7},{width:12},{width:10},{width:12},{width:14},{width:18},{width:28}];
  let r2=writeHeader(ws2);
  const hNPL=ws2.getRow(r2);
  ['Mã NPL','Tên nguyên phụ liệu','ĐVT','Tổng cần','Tồn kho','Cần mua','Giá nhập (₫)','Thành tiền (₫)','Nhà cung cấp']
    .forEach((h,i)=>hNPL.getCell(i+1).value=h);
  styleHdr(hNPL); r2++;
  matsPK.forEach(m=>{
    const row=ws2.getRow(r2);
    [m.matCode||'—',m.matName||'—',m.unit||'—',m.total,m.stock||0,m.toBuy,m.price||0,+(m.toBuy*(m.price||0)).toFixed(0),getNCC(m.matCode)]
      .forEach((v,i)=>row.getCell(i+1).value=v);
    row.height=18; r2++;
  });

  // Tải xuống
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`${o.orderCode}_DinhMuc_${dateStr.replace(/\//g,'-')}.xlsx`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function sidebarSearch(q){
  const el=document.getElementById('sidebar-results');
  if(!el) return;
  const s=q.trim().toLowerCase();
  if(!s){el.innerHTML='';return;}
  const hits=db.products.filter(p=>(p.code||'').toLowerCase().includes(s)||(p.name||'').toLowerCase().includes(s)).slice(0,6);
  if(!hits.length){
    el.innerHTML=`<div style="font-size:12px;color:var(--text3);padding:6px 4px">Không tìm thấy</div>`;
    return;
  }
  el.innerHTML=hits.map(p=>{
    const thumb=(p.images&&p.images.length)?`<img src="${p.images[0].data}" style="width:26px;height:26px;border-radius:5px;object-fit:cover;flex-shrink:0">`:`<div style="width:26px;height:26px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-photo" style="font-size:12px;color:var(--text3)"></i></div>`;
    const codeHL=highlight(p.code||'',q);
    const nameHL=highlight(p.name||'',q);
    return`<div onclick="go('detail','${p.id}');document.getElementById('sidebar-search').value='';sidebarSearch('')"
      style="display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;cursor:pointer;margin-bottom:2px"
      onmouseover="this.style.background='var(--accent-bg)'" onmouseout="this.style.background='transparent'">
      ${thumb}
      <div style="overflow:hidden">
        <div style="font-size:11px;font-weight:600;color:var(--accent-t)">${codeHL}</div>
        <div style="font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nameHL}</div>
      </div>
    </div>`;
  }).join('');
}

// Ctrl+K / Cmd+K để focus vào sidebar search
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){
    e.preventDefault();
    const el=document.getElementById('sidebar-search');
    if(el){el.focus();el.select();}
  }
});

// Chuẩn hoá chuỗi: bỏ dấu, lowercase, trim
function normStr(s){
  return(s||'').toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d');
}

// Tìm màu hex từ tên màu
function detectColor(name){
  if(!name||!name.trim()) return null;
  const n=name.trim().toLowerCase();
  const nn=normStr(n);
  // 1. Khớp chính xác (có dấu)
  if(COLOR_MAP[n]) return COLOR_MAP[n];
  // 2. Khớp chính xác (không dấu)
  for(const[k,v]of Object.entries(COLOR_MAP)){
    if(normStr(k)===nn) return v;
  }
  // 3. Khớp từ khóa đầu tiên chứa trong tên
  for(const[k,v]of Object.entries(COLOR_MAP)){
    if(n.includes(k)||k.includes(n)) return v;
  }
  // 4. Không dấu
  for(const[k,v]of Object.entries(COLOR_MAP)){
    const nk=normStr(k);
    if(nn.includes(nk)||nk.includes(nn)) return v;
  }
  return null;
}

// Tính màu chữ tương phản
function contrastColor(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return(0.299*r+0.587*g+0.114*b)/255>0.55?'#1a1a1a':'#ffffff';
}

// Cập nhật swatch lớn
function updateSwatch(oid,ci,hex,name,code){
  const sw=document.getElementById('sw-'+oid+'-'+ci);
  if(sw){
    sw.style.background=hex;
    const tc=contrastColor(hex);
    const nameEl=document.getElementById('sw-name-'+oid+'-'+ci);
    const codeEl=document.getElementById('sw-code-'+oid+'-'+ci);
    if(nameEl){nameEl.style.color=tc;nameEl.textContent=name||'Chưa đặt tên';}
    if(codeEl){codeEl.style.color=tc;if(code!==undefined)codeEl.textContent=code||'—';}
  }
  const picker=document.getElementById('ch-'+oid+'-'+ci);
  if(picker) picker.value=hex;
}

// Áp dụng màu khi gõ tên màu
function autoColorHex(oid,ci,name){
  updOC(oid,ci,'colorName',name);
  const hex=detectColor(name);
  const hint=document.getElementById('chint-'+oid+'-'+ci);
  if(hex){
    updOC(oid,ci,'colorHex',hex);
    const sw=document.getElementById('sw-'+oid+'-'+ci);
    if(sw){sw.style.background=hex;const i=sw.querySelector('i');if(i)i.style.color=contrastColor(hex);}
    const picker=document.getElementById('ch-'+oid+'-'+ci);
    if(picker) picker.value=hex;
    if(hint){hint.textContent='✓ Tự nhận màu';hint.style.color='var(--success)';}
  } else {
    if(hint){hint.textContent='Nhập tên để tự nhận màu';hint.style.color='var(--text3)';}
  }
}

// Áp dụng màu khi chỉnh thủ công bằng color picker
function applyColorHex(oid,ci,hex){
  updOC(oid,ci,'colorHex',hex);
  const sw=document.getElementById('sw-'+oid+'-'+ci);
  if(sw){sw.style.background=hex;const i=sw.querySelector('i');if(i)i.style.color=contrastColor(hex);}
}

// ── TÍNH ĐỊNH MỨC THEO MÀU ──
function calcOrderMats(o){
  const p=GP(o.productId);
  if(!p||(p.bom||[]).length===0) return [];
  const meta=o.matMeta||{};
  const allColors=o.colors||[];

  return (p.bom||[]).map(m=>{
    // Xác định loại từ siType trong BOM, fallback theo matCode prefix
    const st=m.siType||((m.matCode||'').toUpperCase().startsWith('S')?'chinh':'pk');
    const isSiChinh=st==='chinh';
    const isSiPhu  =st==='phu';
    const isSi     =isSiChinh||isSiPhu;

    const dmEff=(m.dm||0)*(1+(m.hh||0)/100);

    // byColor indexed by ALL colors; PK và Sỉ chính chỉ lấy màu Sỉ chính; Sỉ phụ chỉ lấy màu Sỉ phụ
    const byColor=allColors.map((c,ci)=>{
      const colorSiType=c.siType||'chinh';
      if(isSiPhu   && colorSiType!=='phu') return 0;  // Sỉ phụ chỉ dùng màu Sỉ phụ
      if(!isSiPhu  && colorSiType==='phu') return 0;  // Sỉ chính + PK chỉ dùng màu Sỉ chính
      if(isSi && meta[m.matCode]?.qtyOverride?.[ci]!==undefined)
        return parseFloat(meta[m.matCode].qtyOverride[ci]);
      return parseFloat((dmEff*(c.qty||0)).toFixed(3));
    });

    const total=parseFloat(byColor.reduce((s,v)=>s+v,0).toFixed(3));
    // Ưu tiên: tồn kho nhập tay trong đơn → fallback: db.khoStock từ PM Kho
    const manualStock=(o.materialStock||{})[m.matCode];
    const khoStock=parseFloat((db.khoStock||{})[m.matCode]||0);
    const stock=manualStock!==undefined?parseFloat(manualStock):khoStock;
    const fromKho=manualStock===undefined&&khoStock>0; // đánh dấu lấy từ PM kho
    const toBuy=parseFloat(Math.max(0,total-stock).toFixed(3));
    const mauSac=meta[m.matCode]?.mauSac||'';
    return{...m,dmEff,byColor,total,stock,toBuy,isSi,isSiChinh,isSiPhu,mauSac,fromKho,khoStock};
  });
}

function renderOrderTable(){
  const q=_orderQ.trim().toLowerCase();
  const filtered=q?db.orders.filter(o=>{
    const p=GP(o.productId);
    return(o.orderCode||'').toLowerCase().includes(q)||(p&&((p.name||'').toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q)));
  }):db.orders;
  const wrap=document.getElementById('order-table-wrap');
  if(wrap) wrap.innerHTML=db.orders.length===0
    ?'<div class="empty"><i class="ti ti-clipboard-list"></i><p>Chưa có đơn hàng nào.</p></div>'
    :orderTableHTML(filtered);

  if(info) info.textContent=q?`Tìm thấy ${filtered.length} / ${db.orders.length} đơn`:'';
}

        <label for="ch-${id}-${ci}" style="cursor:pointer;display:inline-block" title="Nhấn để chỉnh màu">
          <div id="sw-${id}-${ci}" style="width:58px;height:52px;border-radius:10px;background:${hex};border:2px solid rgba(0,0,0,.12);margin:0 auto;display:flex;align-items:center;justify-content:center;transition:background .25s;box-shadow:0 2px 6px rgba(0,0,0,.15)">
            <i class="ti ti-pencil no-print" style="font-size:13px;color:${textColor};opacity:.45"></i>
          </div>
          <input type="color" id="ch-${id}-${ci}" value="${hex}" onchange="applyColorHex('${id}',${ci},this.value)" style="width:0;height:0;opacity:0;position:absolute;pointer-events:none">
        </label>
      </td>
      <td style="min-width:110px;padding:8px 10px;vertical-align:middle">
        <input class="dtbl2-in" value="${c.colorCode||''}" placeholder="Mã sỉ..." oninput="updOC('${id}',${ci},'colorCode',this.value)" style="font-size:13px;font-weight:700;width:100%">
      </td>
      <td style="min-width:150px;padding:8px 10px;vertical-align:middle">
        <input class="dtbl2-in" value="${c.colorName||''}" placeholder="VD: Đen, Đỏ đô, Navy…" oninput="autoColorHex('${id}',${ci},this.value)" style="font-size:13px;width:100%">
        <div id="chint-${id}-${ci}" style="font-size:11px;margin-top:3px;color:${detected?'var(--success)':'var(--text3)'}">${detected?'✓ Tự nhận màu':'Nhập tên để tự nhận màu'}</div>
      </td>
      <td style="text-align:right;padding-right:12px;vertical-align:middle">
        <input type="number" value="${c.qty||0}" min="0" onchange="updOCQty('${id}',${ci},+this.value)" style="width:88px;padding:6px 8px;border:1px solid var(--border2);border-radius:7px;font-size:15px;font-weight:700;text-align:right;font-family:inherit;color:var(--text)">
      </td>
      <td class="no-print" style="width:36px;vertical-align:middle">
        <button class="btn btn-ghost btn-sm" onclick="delOC('${id}',${ci})"><i class="ti ti-trash" style="color:var(--danger)"></i></button>
      </td>
    </tr>`;
  };

  const colorThead=`<table class="dtbl2" style="table-layout:auto"><thead><tr>
    <th style="width:36px">#</th><th style="width:80px;text-align:center">Ô màu</th>
    <th style="min-width:110px">Mã sỉ</th><th style="min-width:150px">Tên màu</th>
    <th class="num" style="min-width:110px">SL sản xuất</th><th class="no-print" style="width:36px"></th>
  </tr></thead>`;
  const colorEmpty=txt=>`<div style="padding:8px 16px 10px;font-size:12px;color:var(--text3)">${txt}</div>`;

  // MATERIALS MATRIX — tách thành 2 bảng
  const matsSi     =mats.filter(m=>m.isSi);
  const matsSiChinh=mats.filter(m=>m.isSiChinh);
  const matsSiPhu  =mats.filter(m=>m.isSiPhu);
  const matsPK     =mats.filter(m=>!m.isSi);
  const totalTT    =mats.reduce((s,m)=>s+m.toBuy*(m.price||0),0);
  const allColors  =(o.colors||[]);
  const colorsChinh2=allColors.map((c,ci)=>({...c,_ci:ci})).filter(c=>c.siType!=='phu');
  const colorsPhu2  =allColors.map((c,ci)=>({...c,_ci:ci})).filter(c=>c.siType==='phu');

  // Helper tạo header màu
  const mkColorThs=cols=>cols.map(c=>`<th class="num" style="min-width:80px">
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:3px">
      <span style="width:9px;height:9px;border-radius:2px;background:${c.colorHex||'#ccc'};display:inline-block;border:1px solid rgba(0,0,0,.1)"></span>
      <span>${c.colorCode||'?'}</span>
    </div>
    <div style="font-size:10px;color:var(--text3);font-weight:400;text-align:right">${(c.qty||0).toLocaleString()} sp</div>
  </th>`).join('');

  const tailThs=`<th class="num" style="background:#faf5ff;color:#7c3aed">Tổng cần</th>
    <th class="num">Tồn kho</th>
    <th class="num" style="background:var(--success-bg);color:var(--success)">Cần mua</th>
    <th class="num" style="background:#fffbeb;color:var(--warn)">Giá nhập (₫)</th>
    <th class="num" style="background:#fef3c7;color:#92400e">Thành tiền (₫)</th>`;

  // Helper dòng tổng
  const totalRow=(mList,nFixed,nColors)=>`<tr style="background:#fef3c7;border-top:2px solid #d97706">
    <td colspan="${nFixed+nColors+3}" style="font-size:12px;font-weight:700;color:#92400e;text-align:right;padding-right:10px">
      <i class="ti ti-receipt" style="vertical-align:-2px;margin-right:4px"></i>Tổng thành tiền
    </td>
    <td style="background:#fffbeb"></td>
    <td class="num" style="font-size:13px;font-weight:800;color:#92400e">${mList.reduce((s,m)=>s+m.toBuy*(m.price||0),0)>0?fmt(mList.reduce((s,m)=>s+m.toBuy*(m.price||0),0)):'—'}</td>
  </tr>`;

  // Helper render bảng Si (Sỉ chính hoặc Sỉ phụ)
  const mkSiTable=(mList,colorGroup,accent,accentBg)=>{
    if(!mList.length) return`<div style="padding:10px 16px;font-size:12px;color:var(--text3)">Chưa có NPL nào trong nhóm này.</div>`;
    return`<div class="tbl-wrap">
    <table class="dtbl mat-matrix" style="min-width:${600+colorGroup.length*90}px">
      <thead><tr>
        <th>Mã NPL</th><th>Tên NPL</th><th>ĐVT</th>
        <th style="min-width:90px">Màu sắc</th>
        <th class="num">ĐM/sp</th>
        ${mkColorThs(colorGroup)}${tailThs}
      </tr></thead>
      <tbody>
        ${mList.map(m=>{
          const tt=m.toBuy*(m.price||0);
          return`<tr>
            <td><span class="badge" style="background:${accentBg};color:${accent};font-size:10px">${m.matCode||'—'}</span></td>
            <td style="font-weight:500;font-size:13px">${m.matName||'—'}</td>
            <td style="color:var(--text2)">${m.unit||'—'}</td>
            <td><input type="text" value="${m.mauSac||''}" placeholder="Màu..."
              onchange="updMatMeta('${id}','${m.matCode}','mauSac',this.value)"
              style="width:80px;background:transparent;border:1px solid var(--border2);border-radius:6px;padding:3px 6px;font-size:12px;font-family:inherit"></td>
            <td class="num" style="color:var(--text2)">${m.dmEff.toFixed(3)}</td>
            ${colorGroup.map(c=>`<td class="num">
              <input type="number" value="${m.byColor[c._ci]>0?m.byColor[c._ci]:''}" min="0" step="0.001" placeholder="0"
                onchange="updSiQty('${id}','${m.matCode}',${c._ci},+this.value)"
                style="width:58px;text-align:right;border:1px solid var(--border2);border-radius:5px;font-size:12px;padding:2px 4px;font-family:inherit;background:transparent">
            </td>`).join('')}
            <td class="num" style="font-weight:700;color:#7c3aed;background:#faf5ff">${m.total>0?m.total.toFixed(2):'—'}</td>
            <td class="num"><input type="number" value="${m.stock||''}" min="0" step="0.001" placeholder="0"
              onchange="updOMatStock('${id}','${m.matCode}',+this.value)"
              style="width:60px;padding:2px 5px;border:1px solid var(--border2);border-radius:6px;font-size:12px;text-align:right;font-family:inherit"></td>
            <td class="num" style="font-weight:700;color:${m.toBuy>0?'var(--success)':'var(--text3)'};background:var(--success-bg)">${m.toBuy>0?m.toBuy.toFixed(2):'—'}</td>
            <td class="num" style="background:#fffbeb;color:var(--warn)">${m.price>0?fmtN(m.price)+' ₫':'—'}</td>
            <td class="num" style="background:#fef3c7;font-weight:700;color:#92400e">${tt>0?fmt(tt):'—'}</td>
          </tr>`;}).join('')}
        ${totalRow(mList,5,colorGroup.length)}
      </tbody>
    </table></div>`;
  };

  // ── BẢNG SỈ — 2 nhóm ──
  const siHTML=`
  <div>
    <div style="border-bottom:1px solid var(--border)">
      <div style="padding:9px 14px;background:#fff5f5;display:flex;align-items:center;gap:8px;border-bottom:1px solid #fca5a544">
        <i class="ti ti-circle-filled" style="color:#e11d48;font-size:11px"></i>
        <span style="font-size:13px;font-weight:700;color:#e11d48">Sỉ chính</span>
        <span class="badge" style="background:#fff1f2;color:#e11d48;font-size:11px">${matsSiChinh.length} loại · ${colorsChinh2.length} màu</span>
      </div>
      ${mkSiTable(matsSiChinh,colorsChinh2,'#e11d48','#fff1f2')}
    </div>
    <div>
      <div style="padding:9px 14px;background:#fef9ec;display:flex;align-items:center;gap:8px;border-bottom:1px solid #fcd34d44">
        <i class="ti ti-circle" style="color:#d97706;font-size:11px"></i>
        <span style="font-size:13px;font-weight:700;color:#d97706">Sỉ phụ</span>
        <span class="badge" style="background:#fef3c7;color:#d97706;font-size:11px">${matsSiPhu.length} loại · ${colorsPhu2.length} màu</span>
      </div>
      ${mkSiTable(matsSiPhu,colorsPhu2,'#d97706','#fef3c7')}
    </div>
  </div>`;

  // ── BẢNG NPL (PK) — dùng màu Sỉ chính ──
  const pkHTML=`
  <div style="font-size:13px;font-weight:600;color:var(--success);margin:16px 16px 8px;display:flex;align-items:center;gap:7px">
    <i class="ti ti-needle-thread" style="font-size:15px"></i>Bảng Nguyên phụ liệu
    <span class="badge b-green" style="font-size:11px">${matsPK.length} loại</span>
    <span style="font-size:11px;font-weight:400;color:var(--text2)">· theo màu Sỉ chính</span>
  </div>
  ${matsPK.length===0
    ?`<div style="padding:12px 20px;color:var(--text3);font-size:13px">Không có NPL nào có mã PK.</div>`
    :`<div class="tbl-wrap"><table class="dtbl mat-matrix" style="min-width:${700+colorsChinh2.length*90}px">
    <thead><tr>
      <th>Mã NPL</th><th>Tên NPL</th><th>ĐVT</th><th class="num">ĐM/sp</th>
      ${mkColorThs(colorsChinh2)}${tailThs}
    </tr></thead>
    <tbody>
      ${matsPK.map(m=>{
        const tt=m.toBuy*(m.price||0);
        return`<tr>
          <td><span class="badge b-green" style="font-size:10px">${m.matCode||'—'}</span></td>
          <td style="font-weight:500;font-size:13px">${m.matName||'—'}</td>
          <td style="color:var(--text2)">${m.unit||'—'}</td>
          <td class="num" style="color:var(--text2)">${m.dmEff.toFixed(3)}</td>
          ${colorsChinh2.map(c=>`<td class="num" style="font-size:12px">${m.byColor[c._ci]>0?m.byColor[c._ci].toFixed(2):'—'}</td>`).join('')}
          <td class="num" style="font-weight:700;color:#7c3aed;background:#faf5ff">${m.total>0?m.total.toFixed(2):'—'}</td>
          <td class="num"><input type="number" value="${m.stock||''}" min="0" step="0.001" placeholder="0"
            onchange="updOMatStock('${id}','${m.matCode}',+this.value)"
            style="width:60px;padding:2px 5px;border:1px solid var(--border2);border-radius:6px;font-size:12px;text-align:right;font-family:inherit"></td>
          <td class="num" style="font-weight:700;color:${m.toBuy>0?'var(--success)':'var(--text3)'};background:var(--success-bg)">${m.toBuy>0?m.toBuy.toFixed(2):'—'}</td>
          <td class="num" style="background:#fffbeb;color:var(--warn)">${m.price>0?fmtN(m.price)+' ₫':'—'}</td>
          <td class="num" style="background:#fef3c7;font-weight:700;color:#92400e">${tt>0?fmt(tt):'—'}</td>
        </tr>`;}).join('')}
      ${totalRow(matsPK,4,colorsChinh2.length)}
    </tbody>
  </table></div>`}`;

  const matrixHTML=mats.length===0
    ?`<div style="padding:18px 20px;color:var(--text2);font-size:13px">
        <i class="ti ti-info-circle" style="vertical-align:-2px;margin-right:5px"></i>
        Sản phẩm chưa có định mức NPL. Hãy
        ${p?`<a href="#" onclick="go('detail','${p.id}')" style="color:var(--accent)">thêm định mức trong Chi tiết sản phẩm</a>`:'chọn sản phẩm có định mức'}.
      </div>`
    :siHTML+pkHTML+`<div style="margin:12px 16px 4px;padding:10px 14px;background:#fef3c7;border-radius:8px;font-size:13px;font-weight:700;color:#92400e;display:flex;justify-content:space-between">
      <span><i class="ti ti-receipt" style="vertical-align:-2px;margin-right:5px"></i>Tổng chi phí NPL cần mua (Sỉ + NPL)</span>
      <span>${totalTT>0?fmt(totalTT):'—'}</span>
    </div>`;

  // SUPPLIER TABLE
  const supRows=(o.suppliers||[]).map((s,si)=>
    `<tr>
      <td><input class="dtbl2-in" value="${s.matCode||''}" placeholder="Mã NPL" onchange="updOS('${id}',${si},'matCode',this.value)" style="font-size:11px;color:var(--text2)"></td>
      <td style="font-weight:500"><input class="dtbl2-in" value="${s.matName||''}" placeholder="Tên NPL..." onchange="updOS('${id}',${si},'matName',this.value)"></td>
      <td class="num" style="color:#7c3aed;font-weight:600;font-size:12px">${(()=>{const m=mats.find(m=>m.matCode===s.matCode);return m&&m.toBuy>0?m.toBuy.toFixed(2)+' '+m.unit:'—';})()}</td>
      <td><input class="dtbl2-in" value="${s.supplierName||''}" placeholder="Tên nhà cung cấp..." onchange="updOS('${id}',${si},'supplierName',this.value)" style="font-weight:500"></td>
      <td><input class="dtbl2-in" value="${s.phone||''}" placeholder="0909..." onchange="updOS('${id}',${si},'phone',this.value)"></td>
      <td><input class="dtbl2-in" value="${s.contact||''}" placeholder="Email/Zalo..." onchange="updOS('${id}',${si},'contact',this.value)"></td>
      <td><input class="dtbl2-in" value="${s.note||''}" placeholder="Ghi chú..." onchange="updOS('${id}',${si},'note',this.value)"></td>
      <td class="no-print"><button class="btn btn-ghost btn-sm" onclick="delOS('${id}',${si})"><i class="ti ti-x"></i></button></td>
    </tr>`).join('');

  return`
  <div class="back-nav no-print" onclick="go('orders')"><i class="ti ti-arrow-left" style="font-size:16px"></i> Quay lại danh sách đơn hàng</div>

  <!-- HEADER -->
  <div class="page-hdr" style="flex-wrap:wrap;gap:12px">
    <div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="badge b-blue" style="font-size:13px;padding:4px 12px">${o.orderCode}</span>
        <span class="page-title">${p?p.name:'—'}</span>
        ${p?`<span class="badge b-blue" style="font-size:11px">${p.code}</span>`:''}
        <select onchange="updO('${id}','status',this.value)"
          style="padding:4px 12px;border:1.5px solid ${st2.color}55;border-radius:20px;font-size:12px;font-weight:600;background:${st2.bg};color:${st2.color};cursor:pointer;font-family:inherit;outline:none">
          ${statusOpts}
        </select>
      </div>
      <div class="page-sub" style="margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;align-items:center">
        <span>Ngày tạo: <b>${o.createdAt||'—'}</b></span>
        <span>Ngày giao:
          <input type="date" value="${o.deliveryDate||''}" onchange="updO('${id}','deliveryDate',this.value)"
            style="border:1px solid var(--border2);border-radius:6px;padding:2px 7px;font-size:12px;font-family:inherit;margin-left:4px">
        </span>
        <span>Tổng SL: <b style="color:var(--accent)">${totalQty.toLocaleString('vi-VN')} sp</b></span>
      </div>
    </div>
    <div style="display:flex;gap:8px" class="no-print">
      <button class="btn btn-sec btn-sm" onclick="openMOrder('${id}')"><i class="ti ti-edit"></i> Sửa thông tin</button>
      <button class="btn btn-sec" onclick="window.print()"><i class="ti ti-printer"></i> In / PDF</button>
    </div>
  </div>

  <!-- NOTE -->
  <div style="margin-bottom:14px">
    <input value="${o.note||''}" placeholder="✏️  Ghi chú đơn hàng..." onchange="updO('${id}','note',this.value)"
      style="width:100%;padding:9px 14px;border:1px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);outline:none">
  </div>

  <!-- PRODUCT IMAGES -->
  ${p&&(p.images||[]).length?`
  <div class="d-sec" style="margin-bottom:14px">
    <div class="d-sec-hdr">
      <div class="d-sec-title"><i class="ti ti-photo" style="color:#8b5cf6"></i>Hình ảnh sản phẩm — ${p.name}</div>
    </div>
    <div style="display:flex;gap:10px;padding:14px 16px;flex-wrap:wrap">
      ${p.images.map((img,i)=>`<img src="${img.data}" onclick="openPV('${p.id}',${i})"
        style="width:90px;height:90px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer">`).join('')}
    </div>
  </div>`:''}

  <!-- COLORS & QTY — 2 CỘT SONG SONG -->
  <div class="d-sec" style="margin-bottom:14px">
    <div class="d-sec-hdr">
      <div class="d-sec-title">
        <i class="ti ti-palette" style="color:#e11d48"></i>Màu sắc & Số lượng sản xuất
        <span class="badge" style="background:#fff1f2;color:#e11d48;font-size:11px">${(o.colors||[]).length} màu &nbsp;·&nbsp; ${totalQty.toLocaleString('vi-VN')} sp</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--border)">

      <!-- CỘT SỈ CHÍNH -->
      <div style="background:#fff5f5;border-right:2px solid #fca5a5">
        <div style="padding:9px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #fca5a588;flex-wrap:wrap;gap:6px">
          <span style="font-size:12px;font-weight:700;color:#e11d48;display:flex;align-items:center;gap:5px">
            <i class="ti ti-circle-filled" style="font-size:10px"></i>Sỉ chính
            <span style="font-weight:400;color:var(--text2)">${colorsChinh.length} màu · <b style="color:#e11d48">${qtyChinh.toLocaleString('vi-VN')} sp</b></span>
          </span>
          <button class="btn btn-sm no-print" style="background:#fff1f2;color:#e11d48;border:1px solid #fca5a5;font-size:11px;padding:4px 8px" onclick="addOCTyped('${id}','chinh')">
            <i class="ti ti-plus"></i> Thêm
          </button>
        </div>
        ${colorsChinh.length ? `
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="background:#ffeaea">
            <th style="padding:6px 8px;font-size:10px;color:#e11d48;font-weight:600;text-align:center;width:52px">Ô màu</th>
            <th style="padding:6px 8px;font-size:10px;color:#e11d48;font-weight:600;min-width:80px">Mã sỉ</th>
            <th style="padding:6px 8px;font-size:10px;color:#e11d48;font-weight:600">Tên màu</th>
            <th style="padding:6px 8px;font-size:10px;color:#e11d48;font-weight:600;text-align:right;min-width:80px">SL sản xuất</th>
            <th class="no-print" style="width:30px"></th>
          </tr></thead>
          <tbody>${colorsChinh.map((c,i)=>{
            const ci=c._ci; const hex=c.colorHex||'#ccc';
            const r2=parseInt(hex.slice(1,3),16),g2=parseInt(hex.slice(3,5),16),b2=parseInt(hex.slice(5,7),16);
            const tc=(0.299*r2+0.587*g2+0.114*b2)/255>0.55?'#1a1a1a':'#fff';
            const det=c.colorName?detectColor(c.colorName):null;
            return`<tr style="border-bottom:1px solid #fca5a533">
              <td style="padding:6px 8px;text-align:center">
                <label for="ch-${id}-${ci}" style="cursor:pointer">
                  <div id="sw-${id}-${ci}" style="width:40px;height:36px;border-radius:8px;background:${hex};border:1.5px solid rgba(0,0,0,.12);margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12)">
                    <i class="ti ti-pencil no-print" style="font-size:11px;color:${tc};opacity:.5"></i>
                  </div>
                  <input type="color" id="ch-${id}-${ci}" value="${hex}" onchange="applyColorHex('${id}',${ci},this.value)" style="width:0;height:0;opacity:0;position:absolute;pointer-events:none">
                </label>
              </td>
              <td style="padding:6px 8px"><input class="dtbl2-in" value="${c.colorCode||''}" placeholder="Mã..." oninput="updOC('${id}',${ci},'colorCode',this.value)" style="font-size:12px;font-weight:700;width:100%"></td>
              <td style="padding:6px 8px">
                <input class="dtbl2-in" value="${c.colorName||''}" placeholder="Tên màu..." oninput="autoColorHex('${id}',${ci},this.value)" style="font-size:12px;width:100%">
                <div id="chint-${id}-${ci}" style="font-size:10px;color:${det?'var(--success)':'var(--text3)'}">${det?'✓ Nhận màu':''}</div>

function genOrderCode(){
  const now=new Date();
  const mm=String(now.getMonth()+1).padStart(2,'0'); // 01–12
  const yy=String(now.getFullYear()).slice(-2);       // 25
  const prefix=`DH${mm}${yy}-`;  // VD: DH0125- = Tháng 01/2025
  // Đếm số lớn nhất trong tháng hiện tại
  let max=0;
  db.orders.forEach(o=>{
    if((o.orderCode||'').startsWith(prefix)){
      const n=parseInt((o.orderCode||'').slice(prefix.length))||0;
      if(n>max) max=n;
    }
  });
  return prefix+String(max+1).padStart(3,'0'); // VD: DH0125-001
}

function saveOrder(id){
  const code=document.getElementById('o-code').value.trim();
  const prod=document.getElementById('o-prod').value;
  if(!code) return alert('Mã đơn hàng không được để trống.');
  if(!prod) return alert('Vui lòng chọn sản phẩm.');
  // Kiểm tra mã trùng (trừ chính đơn đang sửa)
  const dup=db.orders.find(x=>x.orderCode===code&&x.id!==id);
  if(dup) return alert(`Mã "${code}" đã tồn tại (đơn hàng ${dup.orderCode}). Vui lòng dùng mã khác.`);
  const date=document.getElementById('o-date').value;
  const note=document.getElementById('o-note').value.trim();
  if(id){
    const o=db.orders.find(x=>x.id===id);
    Object.assign(o,{orderCode:code,productId:prod,deliveryDate:date,note});
    saveDB();closeM();go('order-detail',id);
  } else {
    const newO={id:uid(),orderCode:code,productId:prod,deliveryDate:date,note,
      status:'draft',createdAt:today(),colors:[],suppliers:[],materialStock:{}};
    db.orders.push(newO);
    saveDB();closeM();go('order-detail',newO.id);
  }
}
function delOrder(id){
  if(!confirm('Xóa đơn hàng này? Không thể khôi phục.'))return;
  db.orders=db.orders.filter(x=>x.id!==id);

}
